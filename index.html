<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi Ki Doğdun Koca Bebeğim!</title>
    <link href="http://googleusercontent.com/fonts.googleapis.com/css2" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            /* Fontu uyguluyoruz: 'Cormorant Garamond' */
            font-family: 'Cormorant Garamond', serif; 
            font-size: 1.2rem;
            /* Arka plan KOYU MAVİ */
            background-color: #001a33; 
            color: #dbeafe; /* Açık mavi metin rengi */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; /* Uçuşan objeler için */
        }
        
        /* Şifre Ekranı (Koyu tema) */
        #login-screen { 
            text-align: center; 
            background: #002d5a; 
            padding: 50px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            z-index: 10;
        }
        #login-screen h2 { color: #f9d74c; font-weight: normal; } /* Sarı başlık */
        
        input { 
            padding: 12px; 
            width: 250px; 
            border: 2px solid #64b5f6; 
            background: #001a33;
            color: white;
            border-radius: 10px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-family: 'Cormorant Garamond', serif;
        }
        
        button { 
            padding: 12px 30px; 
            background: #f9d74c; /* Batman sarısı */
            color: #1a237e; /* Koyu lacivert metin */
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s;
            font-family: 'Cormorant Garamond', serif;
        }
        button:hover { background: #ffca28; transform: scale(1.05); }

        /* Ana İçerik */
        #main-content { 
            display: none; 
            max-width: 800px; 
            width: 90%; 
            text-align: center; 
            padding: 40px 20px; 
            opacity: 0; /* Animasyon için */
            animation: fadeIn 1s forwards;
            animation-delay: 0.5s;
        }
